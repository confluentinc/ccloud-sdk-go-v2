    name: API Team
    url: https://confluent.slack.com/app_redirect?channel=api-eng
  description: API to collect data on Confluent Terraform Provider resource operations
    run against Confluent Cloud
  title: Terraform Usage API
  version: 0.0.1
  x-api-group: terraform-usage/v1
  x-api-id: 6290f335-38a8-4993-86da-fab52fc71e08
