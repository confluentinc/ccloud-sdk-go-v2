  schemas:
    terraform-usage.v1.Usage:
      description: |-
        `Usage` objects represent a single Confluent Terraform Provider resource operation that was run against
        Confluent Cloud.
        The API creates usage objects that are collected for Terraform Provider analytics.

        Every attribute is metadata describing the operation itself. No attribute is defined to carry Terraform
        configuration values, resource attribute values, or map keys or values. `resource_type` and the elements of
        `changed_attributes` are further constrained by pattern to flat identifiers, which rejects Terraform
        resource addresses, dotted map keys, and configuration bodies.


        ## The Usages Model
        <SchemaDefinition schemaRef="#/components/schemas/terraform-usage.v1.Usage" />
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - terraform-usage/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - Usage
          readOnly: true
          type: string
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace;
            it is normally unique across time but not space. That is, you can assume
            that the ID will not be reclaimed and reused after an object is deleted
            ("time"); however, it may collide with IDs for other object `kinds` or
            objects of the same `kind` within a different scope/namespace ("space").
          example: dlz-f3a90de
          maxLength: 255
          readOnly: true
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/terraform-usage/v1/usages/u-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/usage=u-12345
        run_id:
          description: |
            Identifier generated once per provider process and shared by every operation that process reports.

            This identifier is process-scoped, not workflow-scoped. Terraform Core launches a separate provider
            process for the plan phase and for the apply phase, and a separate process for each aliased `provider`
            block, so a `run_id` does not correlate a plan with its paired apply, nor one aliased provider instance
            with another. Consumers must not treat it as a plan, apply, workflow, or session identifier.

            The value is randomly generated per process. It must not be derived from the Terraform workspace,
            module path, or any other user-authored name.
          example: 7d7cf9f0-4c72-4a1f-9b8a-3a2f0f3a4b21
          format: uuid
          maxLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        sequence:
          description: |
            Position of this operation in the order the provider started operations within its `run_id`, counting
            from 1.

            Values are unique within a `run_id` and increase in the order operations were started, but the set of
            events the API receives is neither ordered nor complete. Terraform walks the resource graph
            concurrently and each event is reported only after its operation finishes, so a lower sequence number
            can arrive after a higher one. Reporting is best-effort and the provider stops reporting after a fixed
            number of events in a run, so numbers can be missing and the highest value received can undercount the
            operations the run actually performed.
          example: 7
          format: int32
          minimum: 1
          type: integer
        started_at:
          description: The date and time at which the operation began. It is represented
            in RFC3339 format and is in UTC.
          example: 2026-08-14T18:04:05Z
          format: date-time
          type: string
        duration_ms:
          description: How long the operation took, in milliseconds, measured by the
            provider from the start of the operation until just before it returned
          example: 1543
          format: int32
          minimum: 0
          type: integer
        os:
          description: Operating system of the provider binary that ran the operation,
            as reported by the Go runtime's `GOOS`
          example: darwin
          maxLength: 32
          pattern: ^[a-z0-9]+$
          type: string
        arch:
          description: Architecture of the provider binary that ran the operation,
            as reported by the Go runtime's `GOARCH`
          example: amd64
          maxLength: 32
          pattern: ^[a-z0-9]+$
          type: string
        provider_version:
          description: Version of the Confluent Terraform Provider that ran the operation.
            One provider process loads exactly one provider binary, so this value
            is constant for a given `run_id`
          example: 2.82.3
          maxLength: 64
          type: string
        terraform_version:
          description: Version of Terraform that launched the provider process, as
            reported to the provider by Terraform Core
          example: 1.14.4
          maxLength: 64
          type: string
        resource_type:
          description: Terraform resource type that the operation was performed on.
            This is the resource type the provider registers, never a Terraform resource
            address, whose second component is a user-authored name
          example: confluent_kafka_topic
          maxLength: 64
          pattern: ^confluent_[a-z0-9_]+$
          type: string
        operation:
          description: Operation that the provider performed on the resource. Values
            outside the listed set are accepted so that a newer provider can report
            an operation this version of the API does not yet name
          example: CREATE
          maxLength: 32
          pattern: ^[A-Z][A-Z0-9_]*$
          type: string
          x-extensible-enum:
          - CREATE
          - READ
          - UPDATE
          - DELETE
          - IMPORT
        changed_attributes:
          description: |
            Names of the resource's attributes that the operation changed. Empty for operations that change no
            attributes, such as `READ` and `IMPORT`.

            Only top-level attribute names declared in the provider's resource schema are reported. Attribute
            values are never reported, and a map-typed attribute contributes only its own declared name, never the
            map's runtime keys or values. Elements must be valid Terraform SDK field names, which rejects dotted
            paths such as `config.cleanup.policy` and anything containing whitespace or punctuation.
          example:
          - topic_name
          - partitions_count
          items:
            maxLength: 64
            pattern: ^[a-z0-9_]+$
            type: string
          maxItems: 200
          type: array
        error:
          description: If an error occurred while running the operation. Also set
            when the operation panicked, in which case `stack_frames` is populated
          example: true
          type: boolean
        stack_frames:
          description: |
            Source locations from the stack trace of a panic, reported only when the operation panicked.

            Each entry is a Go source location of the form `<path>:<line>`, taken from the provider's own stack
            trace and filtered to Go source lines. Panic messages, function arguments, and resource state are not
            included. Paths are recorded when the provider binary is compiled, not when it runs, so they do not
            describe the machine running Terraform, unless the binary was built locally rather than from an
            official release, in which case they are paths on the machine that built it. Official release builds
            trim the module prefix but not the Go runtime prefix, so runtime frames still carry an absolute path
            from the release build machine.
          example:
          - /home/runner/.goenv/versions/1.25.9/src/runtime/panic.go:884
          - github.com/confluentinc/terraform-provider-confluent/internal/provider/telemetry/wrapper.go:88
          items:
            maxLength: 256
            type: string
          maxItems: 64
          type: array
      type: object
    ObjectMeta:
      description: ObjectMeta is metadata that all persisted resources must have,
        which includes all objects users must create.
      properties:
        self:
          description: Self is a Uniform Resource Locator (URL) at which an object
            can be addressed. This URL encodes the service location, API version,
            and other particulars necessary to locate the resource at a point in time
          example: https://api.confluent.cloud/v2/kafka-clusters/lkc-f3a90de
          format: uri
          readOnly: true
          type: string
        resource_name:
          description: Resource Name is a Uniform Resource Identifier (URI) that is
            globally unique across space and time. It is represented as a Confluent
            Resource Name
          example: crn://confluent.cloud/kafka=lkc-f3a90de
          format: uri
          readOnly: true
          type: string
        created_at:
          description: The date and time at which this object was created. It is represented
            in RFC3339 format and is in UTC.
          example: 2006-01-02T15:04:05-07:00
          format: date-time
          readOnly: true
          type: string
        updated_at:
          description: The date and time at which this object was last updated. It
            is represented in RFC3339 format and is in UTC.
          example: 2006-01-02T15:04:05-07:00
          format: date-time
          readOnly: true
          type: string
        deleted_at:
          description: The date and time at which this object was (or will be) deleted.
            It is represented in RFC3339 format and is in UTC.
          example: 2006-01-02T15:04:05-07:00
          format: date-time
          readOnly: true
          type: string
      readOnly: true
      required:
      - self
    ListMeta:
      description: ListMeta describes metadata that resource collections may have
      properties:
        first:
          description: A link to the first page of results. If a response does not
            contain a first link, then direct navigation to the first page is not
            supported.
          example: https://api.confluent.cloud/v2/resourcekinds
          format: uri
          nullable: true
          type: string
        last:
          description: A link to the last page of results. If a response does not
            contain a last link, then direct navigation to the last page is not supported.
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=bcAOehAY8F16YD84Z1wT
          format: uri
          nullable: true
          type: string
        prev:
          description: A link to the previous page of results. If a response does
            not contain a prev link, then either there is no previous data or backwards
            traversal through the result set is not supported.
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=YIXRY97wWYmwzrax4dld
          format: uri
          nullable: true
          type: string
        next:
          description: A link to the next page of results. If a response does not
            contain a next link, then there is no more data available.
          example: https://api.confluent.cloud/v2/resourcekinds?page_token=UvmDWOB1iwfAIBPj6EYb
          format: uri
          nullable: true
          type: string
        total_size:
          description: Number of records in the full result set. This response may
            be paginated and have a smaller number of records.
          example: 123
          format: int32
          minimum: 0
          type: integer
      type: object
    ObjectReference:
      description: ObjectReference provides information for you to locate the referred
        object
      properties:
        id:
          description: ID of the referred resource
          maxLength: 255
          minLength: 1
          type: string
        environment:
          description: Environment of the referred resource, if env-scoped
          maxLength: 255
          minLength: 1
          type: string
        related:
          description: API URL for accessing or modifying the referred object
          format: uri
          minLength: 1
          readOnly: true
          type: string
        resource_name:
          description: CRN reference to the referred resource
          format: uri
          minLength: 1
          readOnly: true
          type: string
        api_version:
          description: API group and version of the referred resource
          minLength: 1
          readOnly: true
          type: string
        kind:
          description: Kind of the referred resource
          minLength: 1
          readOnly: true
          type: string
      required:
      - id
      - related
      - resource_name
      type: object
    Failure:
      description: Provides information about problems encountered while performing
        an operation.
      properties:
        errors:
          description: List of errors which caused this operation to fail
          items:
            $ref: '#/components/schemas/Error'
          type: array
          uniqueItems: true
      required:
      - errors
      type: object
    Error:
      description: Describes a particular error encountered while performing an operation.
      properties:
        id:
          description: A unique identifier for this particular occurrence of the problem.
          maxLength: 255
          type: string
        status:
          description: The HTTP status code applicable to this problem, expressed
            as a string value.
          type: string
        code:
          description: An application-specific error code, expressed as a string value.
          type: string
        title:
          description: A short, human-readable summary of the problem. It **SHOULD
            NOT** change from occurrence to occurrence of the problem, except for
            purposes of localization.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem.
          type: string
        source:
          $ref: '#/components/schemas/Error_source'
      type: object
    Error_source:
      description: If this error was caused by a particular part of the API request,
        the source will point to the query string parameter or request body property
        that caused it.
      properties:
        pointer:
          description: A JSON Pointer [RFC6901] to the associated entity in the request
            document [e.g. "/spec" for a spec object, or "/spec/title" for a specific
            field].
          type: string
        parameter:
          description: A string indicating which query parameter caused the error.
          type: string
      type: object
  securitySchemes:
    cloud-api-key:
      description: Authenticate with Cloud API Keys using HTTP Basic Auth. Treat the
        Cloud API Key ID as the username and Cloud API Key Secret as the password.
      scheme: basic
      type: http
    confluent-sts-access-token:
      description: Authenticate with Confluent API using this credentials (JSON Web
        Tokens) following OAuth 2.0.
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: https://api.confluent.cloud/sts/v1/oauth2/token
      type: oauth2
    confluent_auth:
      description: RBAC permissions required for this endpoint
      flows:
        implicit:
          authorizationUrl: https://confluent.cloud/oauth
          scopes: {}
      type: oauth2
