      x-enable-listmeta: true
      x-enable-objectmeta: true
    switchover.v1.SwitchoverEndpointSpec:
      description: The desired state of the Switchover Endpoint
      example:
        endpoints:
        - cloud: aws
          hostname: lkc-west-platt.us-west-2.aws.private.confluent.cloud
          connection_type: PRIVATE_LINK
          endpoint_filter: ""
          name: west-platt
          region: us-west-2
        - cloud: aws
          hostname: lkc-west-platt.us-west-2.aws.private.confluent.cloud
          connection_type: PRIVATE_LINK
          endpoint_filter: ""
          name: west-platt
          region: us-west-2
        environment_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
        parent_resource_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/switchover-pair=sw-00000
        display_name: prod-kafka-dr-endpoint
        target: west-platt
      properties:
        environment_crn:
          description: |
            The CRN of the environment this switchover endpoint belongs to — always its parent pair's
            environment, derived from `parent_resource_crn` on create (ORC-9794 decision log).
            Read-only: accepting a second copy of the same scope would only create the possibility of
            the two disagreeing. It is also the value whose ID is passed as the `?environment=` query
            parameter on the other operations.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
          format: uri
          readOnly: true
          type: string
        parent_resource_crn:
          description: |
            The CRN of the switchover pair this endpoint is bound to. Must name the same environment as
            `environment_crn`: the pair is looked up in that scope, so a mismatch would report a
            confusing not-found rather than the inconsistency the caller introduced.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/switchover-pair=sw-00000
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/switchover-pair=.+$
          type: string
          x-immutable: true
        display_name:
          description: A human-readable name for the switchover endpoint.
          example: prod-kafka-dr-endpoint
          maxLength: 256
          type: string
        target:
          description: |
            The name of the endpoint that should be active. For stateful pairs the control plane owns
            this value (it follows the pair's active member) and customers cannot set it directly; on
            create it may be provided as an initial value. Must match one of `endpoints[].name`.
          example: west-platt
          type: string
          x-immutable: true
        endpoints:
          description: |
            The endpoint definitions, one per side (e.g. west/east). Must contain exactly 2 entries.
          items:
            $ref: '#/components/schemas/switchover.v1.EndpointConfig'
          maxItems: 2
          minItems: 2
          type: array
          x-immutable: true
      type: object
      x-enable-id: true
      x-enable-listmeta: true
      x-enable-objectmeta: true
