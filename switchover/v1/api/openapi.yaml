      properties:
        environment_crn:
          description: |
            The CRN of the switchover pair's environment. Required; unlike the other operations,
            this endpoint takes it from the request body rather than a query parameter.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
