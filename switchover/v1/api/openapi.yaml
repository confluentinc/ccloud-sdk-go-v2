  schemas:
    switchover.v1.SwitchoverPair:
      description: |-
        `SwitchoverPair` represents a cluster-level Disaster Recovery pairing between two Kafka
        clusters in different regions of the same environment. Exactly one member is active at any
        time; the other is passive and kept in sync via a bidirectional cluster link.

        The API allows you to list, create, read, update, and delete switchover pairs, and to trigger
        a failover (promotion of the passive member) via the `:failover` operation.


        Related guide: [Disaster Recovery for Kafka in Confluent Cloud](https://docs.confluent.io/cloud/current/clusters/cluster-linking/index.html).

        ## The Switchover Pairs Model
        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverPair" />
      example:
        metadata: ""
        kind: SwitchoverPair
        id: sw-f3a90de
        api_version: switchover/v1
        spec:
          environment_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
          failover_type: PLANNED
          members:
          - name: west
            location:
              cloud: aws
              region: us-west-2
            member_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
          - name: west
            location:
              cloud: aws
              region: us-west-2
            member_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
          first_active: west
          display_name: prod-kafka-dr
          active_member: west
        status:
          phase: READY_TO_FAILOVER
          conditions:
          - reason: Reconciled
            member: east
            type: ResourceValidationComplete
            message: The resource is ready.
            status: "True"
          - reason: Reconciled
            member: east
            type: ResourceValidationComplete
            message: The resource is ready.
            status: "True"
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - switchover/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - SwitchoverPair
          readOnly: true
          type: string
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace;
            it is normally unique across time but not space. That is, you can assume
            that the ID will not be reclaimed and reused after an object is deleted
            ("time"); however, it may collide with IDs for other object `kinds` or
            objects of the same `kind` within a different scope/namespace ("space").
          example: sw-f3a90de
          maxLength: 255
          readOnly: true
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/switchover/v1/switchover-pairs/sw-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/switchover-pair=sw-12345
        spec:
          $ref: '#/components/schemas/switchover.v1.SwitchoverPairSpec'
        status:
          $ref: '#/components/schemas/switchover.v1.SwitchoverPairStatus'
      type: object
    switchover.v1.SwitchoverPairStatus:
      description: The status of the Switchover Pair
      example:
        phase: READY_TO_FAILOVER
        conditions:
        - reason: Reconciled
          member: east
          type: ResourceValidationComplete
          message: The resource is ready.
          status: "True"
        - reason: Reconciled
          member: east
          type: ResourceValidationComplete
          message: The resource is ready.
          status: "True"
      properties:
        phase:
          description: |
            The lifecycle phase of the switchover pair:
              PROVISIONING:      the pair is being created and validated;
              READY_TO_FAILOVER: the pair is validated and a failover (planned or unplanned) can be triggered;
              UPDATING:          a failover, failback, or restore operation is in progress;
              READY_TO_RESTORE:  an unplanned failover has completed; the cluster link can be restored;
              FAILED:            resource validation failed for the pair; it must be deleted and recreated;
              DEPROVISIONING:    the pair is being deleted.
          example: READY_TO_FAILOVER
          readOnly: true
          type: string
          x-extensible-enum:
          - PROVISIONING
          - READY_TO_FAILOVER
          - UPDATING
          - READY_TO_RESTORE
          - FAILED
          - DEPROVISIONING
        conditions:
          description: Status conditions providing detailed information about the
            switchover pair's current state.
          items:
            $ref: '#/components/schemas/switchover.v1.Condition'
          readOnly: true
          type: array
      readOnly: true
      required:
      - phase
      type: object
    switchover.v1.SwitchoverEndpoint:
      description: |-
        `SwitchoverEndpoint` represents the endpoint-level Disaster Recovery configuration for a
        `SwitchoverPair`. It exposes a sticky DR bootstrap endpoint that clients connect to so they
        never need to update their bootstrap endpoint after a failover; that bootstrap endpoint is
        not part of this resource's API representation (ORC-10133) and is obtained separately. For
        stateful pairs, the active endpoint follows the pair's active member.

        The API allows you to list, create, read, update, and delete switchover endpoints.


        Related guide: [Disaster Recovery for Kafka in Confluent Cloud](https://docs.confluent.io/cloud/current/clusters/cluster-linking/index.html).

        ## The Switchover Endpoints Model
        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverEndpoint" />
      example:
        metadata: ""
        kind: SwitchoverEndpoint
        id: se-f3a90de
        api_version: switchover/v1
        spec:
          endpoints:
          - cloud: aws
            hostname: lkc-west-platt.us-west-2.aws.private.confluent.cloud
            connection_type: PRIVATE_LINK
            endpoint_filter: ""
            name: west-platt
            region: us-west-2
          - cloud: aws
            hostname: lkc-west-platt.us-west-2.aws.private.confluent.cloud
            connection_type: PRIVATE_LINK
            endpoint_filter: ""
            name: west-platt
            region: us-west-2
          environment_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
          parent_resource_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/switchover-pair=sw-00000
          display_name: prod-kafka-dr-endpoint
          target: west-platt
        status:
          phase: READY
          conditions:
          - reason: Reconciled
            type: ResourceProvisioningComplete
            message: The endpoint is ready.
            status: "True"
          - reason: Reconciled
            type: ResourceProvisioningComplete
            message: The endpoint is ready.
            status: "True"
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - switchover/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - SwitchoverEndpoint
          readOnly: true
          type: string
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace;
            it is normally unique across time but not space. That is, you can assume
            that the ID will not be reclaimed and reused after an object is deleted
            ("time"); however, it may collide with IDs for other object `kinds` or
            objects of the same `kind` within a different scope/namespace ("space").
          example: se-f3a90de
          maxLength: 255
          readOnly: true
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/switchover/v1/switchover-endpoints/se-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/switchover-endpoint=se-12345
        spec:
          $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointSpec'
        status:
          $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointStatus'
      type: object
    switchover.v1.SwitchoverEndpointStatus:
      description: The status of the Switchover Endpoint
      example:
        phase: READY
        conditions:
        - reason: Reconciled
          type: ResourceProvisioningComplete
          message: The endpoint is ready.
          status: "True"
        - reason: Reconciled
          type: ResourceProvisioningComplete
          message: The endpoint is ready.
          status: "True"
      properties:
        phase:
          description: |
            The lifecycle phase of the switchover endpoint:
              PROVISIONING:    the endpoint is being created and reconciled;
              READY:           the endpoint is reconciled and serving traffic;
              FAILED:          the endpoint encountered an error;
              DEPROVISIONING:  the endpoint is being deleted.
          example: READY
          readOnly: true
          type: string
          x-extensible-enum:
          - PROVISIONING
          - READY
          - FAILED
          - DEPROVISIONING
        conditions:
          description: Status conditions providing detailed information about the
            switchover endpoint's current state.
          items:
            $ref: '#/components/schemas/switchover.v1.SwitchoverEndpointCondition'
          readOnly: true
          type: array
      readOnly: true
      required:
      - phase
      type: object
    switchover.v1.SwitchoverPairList:
      description: |
        `SwitchoverPair` represents a cluster-level Disaster Recovery pairing between two Kafka
        clusters in different regions of the same environment. Exactly one member is active at any
        time; the other is passive and kept in sync via a bidirectional cluster link.

        The API allows you to list, create, read, update, and delete switchover pairs, and to trigger
        a failover (promotion of the passive member) via the `:failover` operation.

        ## The Switchover Pairs Model
        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverPair" />
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - switchover/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - SwitchoverPairList
          readOnly: true
          type: string
        metadata:
          $ref: '#/components/schemas/switchover_v1_SwitchoverPairList_metadata'
        data:
          description: |
            A data property that contains an array of resource items. Each entry in the array is a
            separate resource.
          items:
            allOf:
            - $ref: '#/components/schemas/switchover.v1.SwitchoverPair'
            - properties:
