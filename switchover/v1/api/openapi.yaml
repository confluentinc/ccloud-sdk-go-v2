tags:
- description: |-
    [![Early Access](https://img.shields.io/badge/Lifecycle%20Stage-Early%20Access-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy) [![Request Access To Switchover API (Kafka Disaster Recovery)](https://img.shields.io/badge/-Request%20Access%20To%20Switchover%20API%20%28Kafka%20Disaster%20Recovery%29-%23bc8540)](mailto:ccloud-api-access+switchover-v1-early-access@confluent.io?subject=Request%20to%20join%20switchover/v1%20API%20Early%20Access&body=I%E2%80%99d%20like%20to%20join%20the%20Confluent%20Cloud%20API%20Early%20Access%20for%20switchover/v1%20to%20provide%20early%20feedback%21%20My%20Cloud%20Organization%20ID%20is%20%3Cretrieve%20from%20https%3A//confluent.cloud/settings/billing/payment%3E.)

    `SwitchoverPair` represents a cluster-level Disaster Recovery pairing between two Kafka
    clusters in different regions of the same environment. Exactly one member is active at any
    time; the other is passive and kept in sync via a bidirectional cluster link.

    The API allows you to list, create, read, update, and delete switchover pairs, and to trigger
    a failover (promotion of the passive member) via the `:failover` operation.


    Related guide: [Disaster Recovery for Kafka in Confluent Cloud](https://docs.confluent.io/cloud/current/clusters/cluster-linking/index.html).

    ## The Switchover Pairs Model
    <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverPair" />
  name: Switchover Pairs (switchover/v1)
- description: |-
    [![Early Access](https://img.shields.io/badge/Lifecycle%20Stage-Early%20Access-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy) [![Request Access To Switchover API (Kafka Disaster Recovery)](https://img.shields.io/badge/-Request%20Access%20To%20Switchover%20API%20%28Kafka%20Disaster%20Recovery%29-%23bc8540)](mailto:ccloud-api-access+switchover-v1-early-access@confluent.io?subject=Request%20to%20join%20switchover/v1%20API%20Early%20Access&body=I%E2%80%99d%20like%20to%20join%20the%20Confluent%20Cloud%20API%20Early%20Access%20for%20switchover/v1%20to%20provide%20early%20feedback%21%20My%20Cloud%20Organization%20ID%20is%20%3Cretrieve%20from%20https%3A//confluent.cloud/settings/billing/payment%3E.)

    `SwitchoverEndpoint` represents the endpoint-level Disaster Recovery configuration for a
    `SwitchoverPair`. It exposes a sticky DR bootstrap endpoint that clients connect to so they
    never need to update their bootstrap endpoint after a failover; that bootstrap endpoint is
    not part of this resource's API representation (ORC-10133) and is obtained separately. For
    stateful pairs, the active endpoint follows the pair's active member.

    The API allows you to list, create, read, update, and delete switchover endpoints.


    Related guide: [Disaster Recovery for Kafka in Confluent Cloud](https://docs.confluent.io/cloud/current/clusters/cluster-linking/index.html).

    ## The Switchover Endpoints Model
