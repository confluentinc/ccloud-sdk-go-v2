      - kind
      - metadata
      type: object
    switchover.v1.SwitchoverEndpointList:
      description: |
        `SwitchoverEndpoint` represents the endpoint-level Disaster Recovery configuration for a
        `SwitchoverPair`. It exposes a sticky DR bootstrap endpoint that clients connect to so they
        never need to update their bootstrap endpoint after a failover; that bootstrap endpoint is
        not part of this resource's API representation (ORC-10133) and is obtained separately. For
        stateful pairs, the active endpoint follows the pair's active member.

        The API allows you to list, create, read, update, and delete switchover endpoints.

        ## The Switchover Endpoints Model
        <SchemaDefinition schemaRef="#/components/schemas/switchover.v1.SwitchoverEndpoint" />
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - switchover/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - SwitchoverEndpointList
          readOnly: true
          type: string
        metadata:
          $ref: '#/components/schemas/switchover_v1_SwitchoverPairList_metadata'
        data:
          description: |
            A data property that contains an array of resource items. Each entry in the array is a
            separate resource.
          items:
            allOf:
            - $ref: '#/components/schemas/switchover.v1.SwitchoverEndpoint'
            - properties:
                spec:
                  required:
                  - display_name
                  - endpoints
                  - environment_crn
                  - parent_resource_crn
                  type: object
              required:
              - id
              - metadata
              - spec
              - status
              type: object
          type: array
          uniqueItems: true
      required:
      - api_version
      - data
      - kind
      - metadata
      type: object
    switchover.v1.SwitchoverPairMember:
      description: One side (cluster) of a `SwitchoverPair`.
      example:
        name: west
        location:
          cloud: aws
          region: us-west-2
        member_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
      properties:
        name:
          description: A logical name for this member (e.g. "west" or "east"), unique
            within the pair.
          example: west
          type: string
        member_crn:
          description: |
            The Confluent Resource Name (CRN) of the resource this member represents.

            A CRN rather than an ID plus an environment because member types do not share a parent
            hierarchy: a Kafka cluster is `environment → cloud-cluster`, a Flink compute pool is
            `environment → flink-region → compute-pool`, and a Connect connector is
            `environment → cloud-cluster → connector` with a *name* as its leaf, unique only within its
            cluster. A single `environment` field cannot address the latter two unambiguously.

            The environment is read from the CRN, so a pair whose two members live in different
            environments needs no separate per-member environment field.

            For a Kafka cluster both the canonical form and the variant carrying the redundant trailing
            `/kafka=<lkc>` (which the cmk API returns in `metadata.resource_name`) are accepted. The
            short `crn://confluent.cloud/kafka=<lkc>` form is rejected: it is a valid CRN but carries no
            environment. In Terraform the value is available as
            `confluent_kafka_cluster.<name>.rbac_crn`.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/.+$
          type: string
        location:
          $ref: '#/components/schemas/switchover_v1_SwitchoverPairMember_location'
      required:
      - member_crn
      - name
      type: object
    switchover.v1.EndpointConfig:
      description: Configuration for a single endpoint side of a `SwitchoverEndpoint`.
      example:
        cloud: aws
        hostname: lkc-west-platt.us-west-2.aws.private.confluent.cloud
        connection_type: PRIVATE_LINK
        endpoint_filter: ""
        name: west-platt
        region: us-west-2
      properties:
        name:
          description: A logical name for this endpoint side (e.g. "west-platt"),
            unique within the resource.
          example: west-platt
          type: string
        hostname:
          description: The resolved hostname for this endpoint. Set by the Switchover
            service.
          example: lkc-west-platt.us-west-2.aws.private.confluent.cloud
          readOnly: true
          type: string
        cloud:
          description: The cloud provider this endpoint resolves in. Output-only,
            derived server-side.
          example: aws
          readOnly: true
          type: string
        region:
          description: The cloud region this endpoint resolves in. Output-only, derived
            server-side.
          example: us-west-2
          readOnly: true
          type: string
        connection_type:
          description: |
            The connection type of the resolved endpoint (e.g. `PRIVATE_LINK`), from
            cc-endpoint-service's vocabulary. Output-only; empty when the connection type is
            unspecified.
          example: PRIVATE_LINK
          readOnly: true
          type: string
        endpoint_filter:
          allOf:
          - $ref: '#/components/schemas/switchover.v1.EndpointFilter'
      required:
      - endpoint_filter
      - name
      type: object
    switchover.v1.EndpointFilter:
      description: |
        The client-supplied criteria that select which network endpoint to use for this side of the
        switchover pair. This filter is the only part of an endpoint side the caller provides; the
        resolved endpoint details on the parent `EndpointConfig` — `hostname`, `cloud`, `region`, and
        `connection_type` — are derived server-side from the selected network (or access point) and the
        `SwitchoverPair` member, not supplied here (ORC-10125).

        Set `type` to `public` or `private`. A `private` endpoint sets exactly one of `network_crn` or
        `access_point_crn`; each independently resolves a unique endpoint, so a second selector is never
        needed and could only disagree with the first. A `public` endpoint sets neither.

        There is deliberately no environment field: the environment is always recoverable without one —
        from `network_crn` or `access_point_crn` on a private entry, and from the switchover endpoint's
        own `environment_crn` on a public entry. Carrying it here too would only duplicate that fact and
        let a caller name an environment that disagrees with the CRN beside it.
      properties:
        type:
          description: Whether the endpoint is private or public.
          example: private
          type: string
          x-extensible-enum:
          - private
          - public
        network_crn:
          description: |
            CRN of the network to resolve this endpoint against. A private endpoint sets exactly one
            of this or `access_point_crn` — each independently resolves a unique endpoint, so a
            second selector is never needed and could only disagree with the first. A public
            endpoint sets neither.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/network=n-abc123
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/network=.+$
          type: string
        access_point_crn:
          description: |
            CRN of the network access point, for access-point (PNI) endpoints — the alternative to
            `network_crn`; a private endpoint sets exactly one of the two. The `gateway` segment is
            part of the registered canonical form and is required.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/gateway=gw-456xyz/access-point=ap-west-xyz
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+/gateway=[^/]+/access-point=.+$
          type: string
      required:
      - type
      type: object
    switchover.v1.SwitchoverPairFailoverRequest:
      description: Request body for the `:failover` operation on a `SwitchoverPair`.
      properties:
        spec:
          $ref: '#/components/schemas/switchover_v1_SwitchoverPairFailoverRequest_spec'
      required:
      - spec
      type: object
    switchover.v1.SwitchoverPairUpdateRequest:
      description: |
        Request body for updating a `SwitchoverPair`. Only `display_name` is mutable via this
        operation; use the `:failover` operation to change the active member.
      properties:
        spec:
          $ref: '#/components/schemas/switchover_v1_SwitchoverPairUpdateRequest_spec'
      required:
      - spec
      type: object
    switchover.v1.SwitchoverEndpointUpdateRequest:
      description: |
        Request body for updating a `SwitchoverEndpoint`. Only `display_name` is mutable via this
        operation; use the `SwitchoverPair`'s `:failover` operation to change the active endpoint.
      properties:
        spec:
          $ref: '#/components/schemas/switchover_v1_SwitchoverEndpointUpdateRequest_spec'
      required:
      - spec
      type: object
    switchover.v1.Condition:
      description: A single status condition, following the standard Kubernetes/Confluent
        condition pattern.
      example:
        reason: Reconciled
        member: east
        type: ResourceValidationComplete
        message: The resource is ready.
        status: "True"
      properties:
        member:
          description: |
            The `SwitchoverPair` member this condition belongs to. Conditions are recorded per
            member and flattened into a single list, so the same condition `type` can appear once
            per member; this field disambiguates them. Empty for pair-level conditions that have no
            member dimension.
          example: east
          type: string
        type:
          description: |
            The condition type — one of `ResourceValidationComplete`, `ResourcePlannedFailoverComplete`,
            `ResourceUnplannedFailoverComplete`, or `ResourceRestoreComplete`.
          example: ResourceValidationComplete
          type: string
          x-extensible-enum:
          - ResourceValidationComplete
          - ResourcePlannedFailoverComplete
          - ResourceUnplannedFailoverComplete
          - ResourceRestoreComplete
        status:
          description: The status of the condition.
          example: "True"
          type: string
          x-extensible-enum:
          - "True"
          - "False"
          - Unknown
        reason:
          description: A machine-readable reason for the condition's current status.
          example: Reconciled
          type: string
        message:
          description: A human-readable message providing additional detail about
            the condition.
          example: The resource is ready.
          type: string
      required:
      - status
      - type
      type: object
    switchover.v1.SwitchoverEndpointCondition:
      description: |
        A single status condition on a `SwitchoverEndpoint`, following the standard Kubernetes/Confluent
        condition pattern. Unlike a `SwitchoverPair` (whose conditions are per-member), an endpoint has
        a single resource-level condition.
      example:
        reason: Reconciled
        type: ResourceProvisioningComplete
        message: The endpoint is ready.
        status: "True"
      properties:
        type:
          description: The condition type. A `SwitchoverEndpoint` reports the single
            type `ResourceProvisioningComplete`.
          example: ResourceProvisioningComplete
          type: string
          x-extensible-enum:
          - ResourceProvisioningComplete
        status:
          description: The status of the condition.
          example: "True"
          type: string
          x-extensible-enum:
          - "True"
          - "False"
          - Unknown
        reason:
          description: A machine-readable reason for the condition's current status.
          example: Reconciled
          type: string
        message:
          description: A human-readable message providing additional detail about
            the condition.
          example: The endpoint is ready.
          type: string
      required:
      - status
      - type
      type: object
    SearchFilter:
      description: Filter a collection by a string search
      type: string
    switchover.v1.SwitchoverPairSpec:
      description: The desired state of the Switchover Pair
      example:
        environment_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
        failover_type: PLANNED
        members:
        - name: west
          location:
            cloud: aws
            region: us-west-2
          member_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
        - name: west
          location:
            cloud: aws
            region: us-west-2
          member_crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000/cloud-cluster=lkc-00000
        first_active: west
        display_name: prod-kafka-dr
        active_member: west
      properties:
        environment_crn:
          description: |
            The CRN of the environment this resource belongs to.

            Every reference in a request body is a CRN (see `member_crn`), so this is one too rather
            than an `{id}` relationship object — callers learn a single convention, and the
            organization always travels with the reference. A CRN that names no environment is
            rejected; it is not defaulted.

            The `?environment=` query parameter on the other operations remains a bare environment ID:
            it is the standard Confluent collection filter, not a reference to a stored resource.
          example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-00000
          format: uri
          pattern: ^crn://confluent\.cloud/organization=[^/]+/environment=[^/]+$
          type: string
        display_name:
          description: A human-readable name for the switchover pair.
          example: prod-kafka-dr
          maxLength: 256
          type: string
        members:
          description: |
            The two clusters participating in this switchover pair. Must contain exactly 2 members.
          items:
            $ref: '#/components/schemas/switchover.v1.SwitchoverPairMember'
          maxItems: 2
          minItems: 2
          type: array
          x-immutable: true
        active_member:
          description: |
            The name of the member that is currently active. On create, this selects which member
            starts as active; it must match one of the `members[].name` values. Use the `:failover`
            operation to change the active member after creation.
          example: west
          type: string
          x-immutable: true
        first_active:
          description: |
            The member that was active when the pair was created. Output-only and immutable; set
            implicitly at create time and never accepted as input. Comparing it with `active_member`
            distinguishes a pair that has failed over (they differ) from one still on its original
            active member (they match).
          example: west
          readOnly: true
          type: string
        failover_type:
          description: |
            The failover semantics most recently applied to this pair via the `:failover` operation.
            Not settable directly; empty until a failover has been triggered.
          example: PLANNED
          readOnly: true
          type: string
          x-extensible-enum:
          - PLANNED
          - UNPLANNED
          - RESTORE
