      description: Sub-aggregation of this bucket by `aggregation.group_by`. Absent
        when the bucket has no term buckets.
      example:
        buckets:
        - count: 6
          key: key
        - count: 6
          key: key
      properties:
        buckets:
          description: One entry per distinct `group_by` value in this bucket.
          items:
            $ref: '#/components/schemas/logging_v1_AggregationResponse_timestamp_histogram_aggregated_terms_buckets'
          type: array
      type: object
    logging_v1_AggregationResponse_timestamp_histogram_buckets:
      example:
        count: 0
        aggregated_terms:
          buckets:
          - count: 6
            key: key
          - count: 6
            key: key
        key: key
      properties:
        key:
          description: Bucket start, RFC 3339 UTC.
          type: string
        count:
          description: Number of matching documents in this bucket.
          format: int64
          type: integer
        aggregated_terms:
          $ref: '#/components/schemas/logging_v1_AggregationResponse_timestamp_histogram_aggregated_terms'
      type: object
    logging_v1_AggregationResponse_timestamp_histogram:
      description: The timestamp-bucketed histogram.
      example:
        buckets:
        - count: 0
          aggregated_terms:
            buckets:
            - count: 6
              key: key
            - count: 6
              key: key
          key: key
        - count: 0
          aggregated_terms:
            buckets:
            - count: 6
              key: key
            - count: 6
              key: key
          key: key
      properties:
        buckets:
          description: One entry per time bucket, in bucket order. Empty buckets are
            omitted.
          items:
            $ref: '#/components/schemas/logging_v1_AggregationResponse_timestamp_histogram_buckets'
          type: array
      type: object
    logging_v1_ErrorResponse_errors:
      properties:
        id:
          description: A unique identifier for this occurrence of the problem. Not
            returned by the service today.
          maxLength: 255
          type: string
        status:
          description: HTTP status as a string.
          type: string
        code:
          description: An application-specific error code. Not returned by the service
            today.
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of
            the problem.
          type: string
      required:
      - detail
      - status
      type: object
  securitySchemes:
    confluent_auth:
      description: |
        Requests carry a Confluent Cloud data-plane bearer token obtained from a user session
        (`Authorization: Bearer <token>`). Cloud API keys are not accepted. RBAC is evaluated against
        the request's `crn` using the operation the resource catalog declares for its resource type.
      flows:
        implicit:
          authorizationUrl: https://confluent.cloud/oauth
          scopes:
            Complex: RBAC permissions required for this endpoint depend on the resource
              type of the queried CRN.
            None: No authorization check is performed on this endpoint.
      type: oauth2
    data-plane-bearer-token:
      description: |
        Confluent Cloud data-plane bearer token obtained from a user session
        (`Authorization: Bearer <token>`). Cloud API keys are not accepted by this service.
      scheme: bearer
      type: http
