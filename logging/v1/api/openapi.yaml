openapi: 3.0.0
info:
  contact:
    email: logging-platform@confluent.io
    name: Logging Platform
    url: https://confluent.slack.com/app_redirect?channel=logging-platform
  description: |
    # Introduction

    The Logs API is served by `cc-logging-service` and returns customer-facing operational log
    documents for one Confluent Cloud resource, filtered by time window and by the search fields
    declared for that resource type. Its consumers today are the
    Confluent Cloud Console log viewer and the Confluent CLI (`pkg/ccloudv2/logging.go`). This spec
    documents the API exactly as the service serves it on `master` as of 2026-10-15; it is the
    source for the generated Go client.

    # Authentication

    Requests carry a Confluent Cloud data-plane bearer token obtained from a user session
    (`Authorization: Bearer <token>`). Cloud API keys are not accepted. The organization in the
    request's `crn` must match the organization of the token's principal, otherwise the request is
    rejected with `422`.

    Access is gated per organization by the `logging.external.api.enable` LaunchDarkly flag. An
    organization without the flag receives `403` with the detail `Feature is not enabled for this
    organization`.

    # Resource types

    The service resolves the trailing element of `crn` against its resource catalog, which is
    deployment configuration (`resourceCatalog` in `.halyard/cc-logging-service.yaml`). The catalog
    decides which OpenSearch indices are queried, which `search` keys are accepted, which fields a
    document carries in the response, and which RBAC operation is checked. As of 2026-10-15 the
    production catalog serves these resource types:

    | CRN shape (trailing element) | Accepted `search` keys | Allowed values | Returned fields | RBAC operation |
    |------------------------------|------------------------|----------------|-----------------|----------------|
    | `organization/environment/cloud-cluster/connector` | `search_text`, `level`, `task_id`, `id` | `level`: `INFO`, `WARN`, `ERROR`, `FATAL` | `timestamp`, `level`, `task_id`, `message`, `exception.stacktrace`, `id`, `name` | `ReadLogs` |
    | `organization/environment/flink-region/statement` | `search_text`, `level`, `source`, `id` | `level`: `INFO`, `WARN`, `ERROR` | `id`, `timestamp`, `level`, `message`, `crn`, `data`, `exception`, `function_name`, `function_crn`, `source` | `Describe` |
    | `organization/environment/flink-region/cloud-cluster/materialized-table` | `search_text`, `level`, `source`, `id` | `level`: `INFO`, `WARN`, `ERROR`; `source`: `MaterializedTable`, `Function` | `id`, `timestamp`, `level`, `message`, `crn`, `data`, `source`, `materialized_table_name`, `materialized_table_version` | `Describe` |
    | `organization/environment/cloud-cluster/kafka` | `search_text`, `event_type`, `level`, `id` | `level`: `INFO`, `WARN`, `ERROR`; `event_type`: `SERVICE_MAINTENANCE`, `HEALTH_ALERT`, `CONFLUENT_STATUS_UPDATED`, `SERVICE_ISSUE_DETECTED` | `id`, `timestamp`, `level`, `message`, `crn`, `source`, `event_type`, `event_id`, `status`, `cloud_cluster_id` | `ReadLogs` |

    A `crn` that cannot be parsed, or that ends in one of these resource types but does not have every
    element of its shape, is rejected with `422 Invalid CRN`, and an element that does not match its
    position in the shape with `422 Invalid CRN element {element}`; see Choosing a log source for the
    order of the checks. For connectors, the service first
    resolves the connector's logical cluster ID through the metadata service; a connector it cannot
    resolve is reported as `403`, never `404`, so that the response does not reveal whether the
    resource exists.

    The lookback for every resource type above is 3 days. An `end_time` older than that returns an
    empty `200` without querying OpenSearch; a `start_time` older than that is silently clamped.

    Audit logs (`audit_logs/v1`) are served by the same host under a separate path and are not part
    of this spec.

    # Discovery

    `GET /logs/v1/sources` and `GET /logs/v1/sources/{name}` let a client learn which log source
    types this deployment's catalog serves, and what each one supports (crn shape, accepted
    `search` keys and their allowed values, returned fields, and lookback).

    These endpoints make no OpenSearch calls themselves and are
    not subject to the per-resource rate limit described below. They're instead subject to the
    per-IP limit plus their own (user, organization) limit.

    # Choosing a log source

    `source` is optional. The service infers the log source from the `crn`'s trailing element, so a
    client only sets it to pick one of several log sources for the same resource type.

    The service checks the `crn` and `source` in this order and returns the first failure as a `422`:

    1. The `crn` cannot be parsed: `Invalid CRN`.
    2. There is no `source`, and the `crn`'s trailing element is a resource type with more than one
       log source: `source is required for resource type {type}; one of [{sources}]`.
    3. The log source cannot be resolved. With no `source` and a trailing element that is not a
       catalog resource type: `Invalid resource type {type}`. With a `source` that does not exist:
       `Unknown source {name}`. With a `source` that does not serve the `crn`'s trailing resource
       type: `source {name} does not support resource type {type}`.
    4. The `crn` does not have every element of the resolved resource type's shape: `Invalid CRN`.
       An element that does not match its position: `Invalid CRN element {element}`.

    Every query targets one resource, so the `crn` must be complete. A `crn` truncated to an
    organization or an environment ends in `organization` or `environment`, which is not a resource
    type, so it fails at step 3: `Invalid resource type environment` without a `source`, and
    `source cluster-health does not support resource type environment` with one. It never reaches
    step 4. A `crn` that ends in a real resource type but is missing elements, for example one that
    stops after `connector=my-connector` with no environment before it, fails at step 4 with
    `Invalid CRN`.

    # Pagination

    `POST /logs/v1/search` paginates with an opaque `page_token`. When a page is full, the response
    carries the URL of the next page in `metadata.next`; `metadata` is absent when the page was not
    full or was empty. The default page size is 100 documents; the maximum is 1000.

    # Rate limiting

    The rate-limit sidecar enforces, per (resource CRN, user, organization, client type), 1 request
    per second for UI clients (User-Agent containing `mozilla`) and 5 requests per minute for every
    other client, plus 5 requests per second per client IP before authentication. The per-resource
    limit applies only to `POST /logs/v1/search`, which is the only endpoint with a resource CRN to
    key it on; the per-IP limit applies to every endpoint in this spec, including the sources
    endpoints. The sources endpoints additionally enforce their own limit of 60 requests per minute
    per (user, organization) pair, independent of the per-IP check — discovery has no resource to
    key a per-resource limit on, and no UI-vs-other-client distinction the way search does. Every
    response that passed the per-IP limiter carries `X-RateLimit-Limit`, `X-RateLimit-Remaining`,
    and `X-RateLimit-Reset` headers, including non-429 responses; a rate-limited request receives
    `429`. `Retry-After` is not sent. These numbers come from `ratelimit-config.yaml` and
    `discovery-ratelimit-config.yaml` in the service's Halyard spec as of 2026-09-15 and are
    deployment configuration, not part of the API contract.
  title: Confluent Cloud Logs API
  version: 0.1.0
  x-api-id: 33741ed0-9d80-446d-90d6-35490cc5268b
  x-api-group: logging/v1
  x-tag-group: Logs (%s)
  x-audience: company-internal
servers:
- description: Confluent Cloud production
  url: https://api.logging.confluent.cloud
tags:
- description: Search customer-facing operational logs for one Confluent Cloud resource.
  name: Logs (logging/v1)
paths:
  /logs/v1/search:
    post:
      description: |
        Searches log documents for the resource identified by `crn`.

        `search` filters on the keys the resource type accepts (see the Resource types section
        above). An unknown key, or a value outside the key's allowed values, returns `422`. The
        reserved `search_text` key runs a phrase or wildcard match over the resource type's text
        fields (`message`, and `exception.stacktrace` for connectors).

        `start_time` and `end_time` define an inclusive UTC window. An `end_time` older than the
        3-day lookback returns an empty `200`; a `start_time` older than the lookback is silently
        clamped to it. Results page via `page_token`, see the Pagination section above. Requests are
        subject to the rate limits described in the Rate limiting section above.
      operationId: searchLoggingV1Logs
      parameters:
      - description: Number of documents per page. Values outside 1..1000 are rejected
          with 422.
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          default: 100
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        style: form
      - description: Opaque continuation token taken from `metadata.next` of the previous
          response. The page size encoded in the token takes precedence over `page_size`.
          A token that cannot be decoded is ignored and the first page is returned.
        explode: true
        in: query
        name: page_token
        required: false
        schema:
          maxLength: 255
          type: string
        style: form
      requestBody:
        content:
          application/json:
            examples:
              connectorLogs:
                summary: Error and warning logs for one connector, newest first
                value:
                  crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-abc123/cloud-cluster=lkc-abc123/connector=my-connector
                  search:
                    level:
                    - ERROR
                    - WARN
                    search_text: disconnected
                  sort: desc
                  start_time: 2026-09-05T00:00:00Z
                  end_time: 2026-09-07T00:00:00Z
              statementLogsWithHistogram:
                summary: Flink statement logs with an hourly histogram grouped by
                  level
                value:
                  crn: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/environment=env-abc123/flink-region=aws.us-west-2/statement=my-statement
                  search:
                    level: ERROR
                  aggregation:
                    field: timestamp
                    interval: 1h
                    group_by: level
                  start_time: 2026-09-06T00:00:00Z
                  end_time: 2026-09-07T00:00:00Z
            schema:
              $ref: '#/components/schemas/logging.v1.SearchRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                connectorPage:
                  summary: One page of connector documents with a next-page link
                  value:
                    api_version: v1
                    kind: Logs
                    data:
                    - timestamp: 2026-09-06T18:42:10Z
                      level: ERROR
                      task_id: task-0
                      message: Connection to upstream host was lost.
                      exception.stacktrace: org.apache.kafka.connect.errors.ConnectException
                        ...
                      id: lcc-123456
                      name: my-connector
                    - timestamp: 2026-09-06T18:39:55Z
                      level: WARN
                      task_id: task-0
                      message: Retrying connection, attempt 3 of 5.
                      id: lcc-123456
                      name: my-connector
                    metadata:
                      next: https://api.logging.confluent.cloud/logs/v1/search?page_token=eyJvZmZzZXQiOjEwMH0
                lookbackExceeded:
                  summary: end_time older than the lookback, returned without querying
                    the backend
                  value:
                    api_version: v1
                    kind: Logs
                    data: []
              schema:
                $ref: '#/components/schemas/logging.v1.SearchResponse'
          description: Matching documents, newest first when `sort` is `desc`.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              example:
                errors:
                - status: "400"
                  detail: Unable to process JSON
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The request body could not be parsed. The detail text comes
            from the framework's generic JSON handler.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
        "401":
          content:
            application/json:
              example:
                errors:
                - status: "401"
                  detail: Credentials are required to access this resource.
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The request lacks a valid bearer token.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
            WWW-Authenticate:
              description: Always `Basic realm="default"`, the framework default,
                even though the API accepts only bearer tokens.
              explode: false
              schema:
                type: string
              style: simple
        "403":
          content:
            application/json:
              examples:
                featureDisabled:
                  summary: The Logs API is not enabled for this organization
                  value:
                    errors:
                    - status: "403"
                      detail: Feature is not enabled for this organization
                rbacDenied:
                  summary: The caller's role does not grant the required operation,
                    or the resource does not exist
                  value:
                    errors:
                    - status: "403"
                      detail: User is not authorized to perform this action
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The caller is authenticated but not authorized. Returned when
            the Logs API is not enabled for the organization, when the RBAC check
            for the queried resource fails, or when the queried connector cannot be
            resolved through the metadata service. Resource existence is never revealed
            as a 404.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
        "422":
          content:
            application/json:
              examples:
                unknownSearchParameter:
                  summary: A search key the resource type does not accept
                  value:
                    errors:
                    - status: "422"
                      detail: task_owner is not a valid search parameter.
                disallowedValue:
                  summary: A value outside the key's allowed values
                  value:
                    errors:
                    - status: "422"
                      detail: 'Invalid value for field level: DEBUG. Allowed values
                        are: INFO, WARN, ERROR, FATAL'
                invalidCrn:
                  summary: The CRN does not parse, or does not have every element
                    of the resolved source's shape
                  value:
                    errors:
                    - status: "422"
                      detail: Invalid CRN
                invalidCrnElement:
                  summary: A CRN element doesn't match its expected position in the
                    resolved source's shape
                  value:
                    errors:
                    - status: "422"
                      detail: Invalid CRN element cloud-cluster
                unknownResourceType:
                  summary: The CRN's trailing element is a fully unrecognized type
                    - not in the catalog
                  value:
                    errors:
                    - status: "422"
                      detail: Invalid resource type bogus
                unknownSource:
                  summary: source doesn't match any catalog entry
                  value:
                    errors:
                    - status: "422"
                      detail: Unknown source no-such-source
                sourceResourceTypeMismatch:
                  summary: source is a real catalog entry, but its resource type doesn't
                    match the crn's trailing element (for example a crn truncated
                    to an environment)
                  value:
                    errors:
                    - status: "422"
                      detail: source cluster-health does not support resource type
                        environment
                sourceRequiredForResourceType:
                  summary: A full crn, no source, and the resource type has more than
                    one log source. Hypothetical, since no resource type in the current
                    catalog has more than one
                  value:
                    errors:
                    - status: "422"
                      detail: source is required for resource type example-type; one
                        of [example-source-a, example-source-b]
                organizationMismatch:
                  summary: The CRN's organization is not the caller's
                  value:
                    errors:
                    - status: "422"
                      detail: Organization mismatch between CRN and credentials
                startAfterEnd:
                  summary: start_time after end_time
                  value:
                    errors:
                    - status: "422"
                      detail: start_time cannot be after end_time
                invalidDateFormat:
                  summary: A timestamp the service cannot parse, for example one with
                    a fractional second or a +00:00 offset. Send whole seconds with
                    a Z suffix
                  value:
                    errors:
                    - status: "422"
                      detail: Invalid date format. Please use RFC3339 format with
                        UTC timezone.
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The request failed schema or catalog validation.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
        "429":
          content:
            application/json:
              examples:
                perResource:
                  summary: Per (resource, user, organization, client type) limit exceeded
                    (POST /logs/v1/search only)
                  value:
                    errors:
                    - status: "429"
                      detail: 'Too many requests have been made for resource: crn://confluent.cloud/organization=9bb441c4-.../cloud-cluster=lkc-abc123/connector=my-connector.
                        Please see the documentation for current rate limits.'
                perIp:
                  summary: Per client IP limit exceeded, before authentication (every
                    endpoint, including the sources endpoints)
                  value:
                    errors:
                    - status: "429"
                      detail: 'Too many requests have been made from this IP address:
                        203.0.113.7. Please see the documentation for current rate
                        limits.'
                discoveryLimit:
                  summary: Per (user, organization) discovery limit exceeded (the
                    sources endpoints only - see the Rate limiting section above)
                  value:
                    errors:
                    - status: "429"
                      detail: Too many source discovery requests. Please see the documentation
                        for current rate limits.
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The caller has exceeded a rate limit described in the Rate
            limiting section above.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
            X-RateLimit-Limit:
              description: The maximum number of requests permitted in the current
                window.
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Remaining:
              description: The number of requests remaining in the current window.
              explode: false
              schema:
                type: integer
              style: simple
            X-RateLimit-Reset:
              description: Seconds until the current rate limit window resets.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              example:
                errors:
                - status: "500"
                  detail: There was an error processing your request. It has been
                    logged (ID 4f1c9a2b7d3e8f60).
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: An unexpected server error occurred and the request was not
            processed. The detail text comes from the framework's generic exception
            handler and carries a log correlation ID.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
        "503":
          content:
            application/json:
              example:
                errors:
                - status: "503"
                  detail: HTTP 503 Service Unavailable
              schema:
                $ref: '#/components/schemas/logging.v1.ErrorResponse'
          description: The OpenSearch backend returned an error or was unreachable.
          headers:
            X-Request-Id:
              description: The unique identifier for the API request, set by the service
                on every response.
              explode: false
              schema:
                type: string
              style: simple
      security:
      - data-plane-bearer-token: []
      - confluent_auth:
        - Complex
      summary: Search logs
      tags:
      - Logs (logging/v1)
      x-codeSamples:
      - lang: Shell
        source: |-
          curl --request POST \
            --url https://api.logging.confluent.cloud/logs/v1/search \
            --header 'Authorization: Bearer REPLACE_BEARER_TOKEN' \
            --header 'content-type: application/json' \
            --data '{"crn":"crn://confluent.cloud/organization=9bb441c4-.../environment=env-123/cloud-cluster=lkc-abc123/connector=my-connector","source":"connector","search":{"level":["ERROR","WARN"],"search_text":"disconnected"},"sort":"asc","aggregation":{"field":"timestamp","interval":"string","group_by":"string"},"start_time":"2026-08-20T00:00:00Z","end_time":"2026-08-21T00:00:00Z"}'
      - lang: Java
        source: |-
          OkHttpClient client = new OkHttpClient();

          MediaType mediaType = MediaType.parse("application/json");
          RequestBody body = RequestBody.create(mediaType, "{\"crn\":\"crn://confluent.cloud/organization=9bb441c4-.../environment=env-123/cloud-cluster=lkc-abc123/connector=my-connector\",\"source\":\"connector\",\"search\":{\"level\":[\"ERROR\",\"WARN\"],\"search_text\":\"disconnected\"},\"sort\":\"asc\",\"aggregation\":{\"field\":\"timestamp\",\"interval\":\"string\",\"group_by\":\"string\"},\"start_time\":\"2026-08-20T00:00:00Z\",\"end_time\":\"2026-08-21T00:00:00Z\"}");
          Request request = new Request.Builder()
            .url("https://api.logging.confluent.cloud/logs/v1/search")
            .post(body)
            .addHeader("content-type", "application/json")
            .addHeader("Authorization", "Bearer REPLACE_BEARER_TOKEN")
            .build();

          Response response = client.newCall(request).execute();
      - lang: Go
        source: "package main\n\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"net/http\"\
          \n\t\"io/ioutil\"\n)\n\nfunc main() {\n\n\turl := \"https://api.logging.confluent.cloud/logs/v1/search\"\
          \n\n\tpayload := strings.NewReader(\"{\\\"crn\\\":\\\"crn://confluent.cloud/organization=9bb441c4-.../environment=env-123/cloud-cluster=lkc-abc123/connector=my-connector\\\
          \",\\\"source\\\":\\\"connector\\\",\\\"search\\\":{\\\"level\\\":[\\\"\
          ERROR\\\",\\\"WARN\\\"],\\\"search_text\\\":\\\"disconnected\\\"},\\\"sort\\\
          \":\\\"asc\\\",\\\"aggregation\\\":{\\\"field\\\":\\\"timestamp\\\",\\\"\
          interval\\\":\\\"string\\\",\\\"group_by\\\":\\\"string\\\"},\\\"start_time\\\
          \":\\\"2026-08-20T00:00:00Z\\\",\\\"end_time\\\":\\\"2026-08-21T00:00:00Z\\\
          \"}\")\n\n\treq, _ := http.NewRequest(\"POST\", url, payload)\n\n\treq.Header.Add(\"\
          content-type\", \"application/json\")\n\treq.Header.Add(\"Authorization\"\
          , \"Bearer REPLACE_BEARER_TOKEN\")\n\n\tres, _ := http.DefaultClient.Do(req)\n\
          \n\tdefer res.Body.Close()\n\tbody, _ := ioutil.ReadAll(res.Body)\n\n\t\
          fmt.Println(res)\n\tfmt.Println(string(body))\n\n}"
      - lang: Python
        source: |-
          import http.client

          conn = http.client.HTTPSConnection("api.logging.confluent.cloud")

          payload = "{\"crn\":\"crn://confluent.cloud/organization=9bb441c4-.../environment=env-123/cloud-cluster=lkc-abc123/connector=my-connector\",\"source\":\"connector\",\"search\":{\"level\":[\"ERROR\",\"WARN\"],\"search_text\":\"disconnected\"},\"sort\":\"asc\",\"aggregation\":{\"field\":\"timestamp\",\"interval\":\"string\",\"group_by\":\"string\"},\"start_time\":\"2026-08-20T00:00:00Z\",\"end_time\":\"2026-08-21T00:00:00Z\"}"

          headers = {
              'content-type': "application/json",
              'Authorization': "Bearer REPLACE_BEARER_TOKEN"
              }

          conn.request("POST", "/logs/v1/search", payload, headers)

          res = conn.getresponse()
          data = res.read()

          print(data.decode("utf-8"))
      - lang: Node
        source: |-
          const http = require("https");

          const options = {
            "method": "POST",
            "hostname": "api.logging.confluent.cloud",
            "port": null,
            "path": "/logs/v1/search",
            "headers": {
              "content-type": "application/json",
              "Authorization": "Bearer REPLACE_BEARER_TOKEN"
            }
          };

          const req = http.request(options, function (res) {
            const chunks = [];

            res.on("data", function (chunk) {
              chunks.push(chunk);
            });

            res.on("end", function () {
              const body = Buffer.concat(chunks);
              console.log(body.toString());
            });
          });

          req.write(JSON.stringify({
            crn: 'crn://confluent.cloud/organization=9bb441c4-.../environment=env-123/cloud-cluster=lkc-abc123/connector=my-connector',
            source: 'connector',
            search: {level: ['ERROR', 'WARN'], search_text: 'disconnected'},
            sort: 'asc',
            aggregation: {field: 'timestamp', interval: 'string', group_by: 'string'},
            start_time: '2026-08-20T00:00:00Z',
            end_time: '2026-08-21T00:00:00Z'
          }));
          req.end();
      - lang: C
        source: |-
          CURL *hnd = curl_easy_init();

          curl_easy_setopt(hnd, CURLOPT_CUSTOMREQUEST, "POST");
          curl_easy_setopt(hnd, CURLOPT_URL, "https://api.logging.confluent.cloud/logs/v1/search");

          struct curl_slist *headers = NULL;
          headers = curl_slist_append(headers, "content-type: application/json");
