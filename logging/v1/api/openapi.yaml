          description: Inclusive window start, RFC 3339 in UTC with whole seconds
            and a `Z` suffix, as in the example. This is a string with a pattern,
            not `date-time`, so a generated client sends exactly this form and not
            a fractional second or a local offset. The service parses `yyyy-MM-dd'T'HH:mm:ssX`
