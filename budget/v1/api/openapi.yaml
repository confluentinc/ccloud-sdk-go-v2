tags:
- description: |-
    [![General Availability](https://img.shields.io/badge/Lifecycle%20Stage-General%20Availability-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy)

    An `InferenceBudget` caps and monitors inference consumption, measured in US dollars (USD),
    over a recurring budget period. It records the desired budget policy in its `spec` and the observed
    consumption against that policy in its server-computed `status`.

    Reads are available to any authenticated caller with describe access. Creating, updating, and deleting
    a budget is restricted to organization administrators.


    ## The Inference Budgets Model
    <SchemaDefinition schemaRef="#/components/schemas/budget.v1.InferenceBudget" />
