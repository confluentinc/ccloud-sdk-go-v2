  schemas:
    budget.v1.InferenceBudget:
      description: |-
        An `InferenceBudget` caps and monitors inference consumption, measured in US dollars (USD),
        over a recurring budget period. It records the desired budget policy in its `spec` and the observed
        consumption against that policy in its server-computed `status`.

        Reads are available to any authenticated caller with describe access. Creating, updating, and deleting
        a budget is restricted to organization administrators.


        ## The Inference Budgets Model
        <SchemaDefinition schemaRef="#/components/schemas/budget.v1.InferenceBudget" />
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - budget/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - InferenceBudget
          readOnly: true
          type: string
        id:
          description: ID is the "natural identifier" for an object within its scope/namespace;
            it is normally unique across time but not space. That is, you can assume
            that the ID will not be reclaimed and reused after an object is deleted
            ("time"); however, it may collide with IDs for other object `kinds` or
            objects of the same `kind` within a different scope/namespace ("space").
          example: inference-budget-f3a90de
          maxLength: 255
          readOnly: true
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/ObjectMeta'
          - properties:
              self:
                example: https://api.confluent.cloud/budget/v1/inference-budgets/inference-budget-12345
              resource_name:
                example: crn://confluent.cloud/organization=9bb441c4-edef-46ac-8a41-c49e44a3fd9a/inference-budget=inference-budget-12345
        spec:
          $ref: '#/components/schemas/budget.v1.InferenceBudgetSpec'
        status:
          $ref: '#/components/schemas/budget.v1.InferenceBudgetStatus'
      type: object
    budget.v1.InferenceBudgetStatus:
      description: The status of the Inference Budget
      properties:
        period_start:
          description: The start of the current budget period, in RFC3339 UTC.
          example: 2026-08-01T00:00:00Z
          format: date-time
          type: string
        period_end:
          description: The end of the current budget period, in RFC3339 UTC.
          example: 2026-09-01T00:00:00Z
          format: date-time
          type: string
        consumed_usd:
          description: |
            The inference spend consumed so far in the current budget period, in US dollars as a decimal
            string with two fractional digits (e.g. "42.50").
          example: "42.50"
          pattern: ^\d+\.\d{2}$
          type: string
        as_of:
          description: The date and time at which the consumption figures were computed,
            in RFC3339 UTC.
          example: 2026-08-21T14:37:11Z
          format: date-time
          type: string
        percent_consumed:
          description: The percentage of the budget consumed so far in the current
            budget period.
          example: 42.5
          format: double
          type: number
        last_notified_percent:
          description: The highest notification threshold that has fired so far in
            the current budget period.
          example: 0
          format: int32
          type: integer
        last_reconciled:
          description: |
            The watermark up to which consumption has been reconciled against source usage records.
            Reconciliation runs hourly.
          example: 2026-08-21T14:00:00Z
          format: date-time
          type: string
      readOnly: true
      type: object
    budget.v1.InferenceBudgetList:
      description: |-
        An `InferenceBudget` caps and monitors inference consumption, measured in US dollars (USD),
        over a recurring budget period. It records the desired budget policy in its `spec` and the observed
        consumption against that policy in its server-computed `status`.

        Reads are available to any authenticated caller with describe access. Creating, updating, and deleting
        a budget is restricted to organization administrators.


        ## The Inference Budgets Model
        <SchemaDefinition schemaRef="#/components/schemas/budget.v1.InferenceBudget" />
      properties:
        api_version:
          description: APIVersion defines the schema version of this representation
            of a resource.
          enum:
          - budget/v1
          readOnly: true
          type: string
        kind:
          description: Kind defines the object this REST resource represents.
          enum:
          - InferenceBudgetList
          readOnly: true
          type: string
        metadata:
          allOf:
          - $ref: '#/components/schemas/ListMeta'
          - properties:
              first:
                example: https://api.confluent.cloud/budget/v1/inference-budgets
              last:
                example: https://api.confluent.cloud/budget/v1/inference-budgets?page_token=bcAOehAY8F16YD84Z1wT
              prev:
                example: https://api.confluent.cloud/budget/v1/inference-budgets?page_token=YIXRY97wWYmwzrax4dld
              next:
                example: https://api.confluent.cloud/budget/v1/inference-budgets?page_token=UvmDWOB1iwfAIBPj6EYb
        data:
          description: A data property that contains an array of resource items. Each
            entry in the array is a separate resource.
          items:
            allOf:
            - $ref: '#/components/schemas/budget.v1.InferenceBudget'
            - properties:
                spec:
                  required:
                  - max_inference_usd
                  - period
                  - scope
                  type: object
              required:
              - id
              - metadata
              - spec
              type: object
          type: array
          uniqueItems: true
      required:
      - api_version
      - data
      - kind
      - metadata
      type: object
    budget.v1.InferenceBudgetSpec:
      description: The desired state of the Inference Budget
      properties:
        period:
          description: |
            The period over which inference consumption accumulates and resets. The set of values may grow
            over time.
          example: MONTHLY
          type: string
          x-extensible-enum:
          - MONTHLY
        notification_thresholds:
          default:
          - 50
          - 90
          - 100
          description: |
            The percentages of the budget at which notifications fire, each a whole percentage from 1 to 100.
            Multiple thresholds may be configured, and each fires once as consumption crosses it. Defaults to
            50, 90, and 100 percent.
          example:
          - 50
          - 90
          - 100
          items:
            format: int32
            maximum: 100
            minimum: 1
            type: integer
          type: array
        scope:
          description: |
            The scope of resources whose inference consumption counts against this budget. The set of values
            may grow over time.
          example: ORGANIZATION
          type: string
          x-extensible-enum:
          - ORGANIZATION
        max_inference_usd:
          description: |
            The maximum inference spend permitted within the period, in US dollars as a decimal string with two
            fractional digits (e.g. "100.00"). A string rather than a float so the currency amount is exact.
          example: "100.00"
          pattern: ^\d+\.\d{2}$
          type: string
        enforcement_mode:
          description: |
            The action taken when consumption reaches the cap. The set of values may grow over time.
          example: NOTIFY
          type: string
          x-extensible-enum:
          - NOTIFY
      type: object
      x-enable-id: true
      x-enable-listmeta: true
      x-enable-objectmeta: true
