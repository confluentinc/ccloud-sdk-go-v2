          type: string
        source:
          $ref: '#/components/schemas/Error_source'
      type: object
    Error_source:
      description: If this error was caused by a particular part of the API request,
        the source will point to the query string parameter or request body property
        that caused it.
      example:
        pointer: pointer
        parameter: parameter
      properties:
        pointer:
          description: A JSON Pointer [RFC6901] to the associated entity in the request
            document [e.g. "/spec" for a spec object, or "/spec/title" for a specific
            field].
          type: string
        parameter:
          description: A string indicating which query parameter caused the error.
          type: string
      type: object
  securitySchemes:
    resource-api-key:
      description: Authenticate with resource-specific API Keys using HTTP Basic Auth.
        Treat the resource-specific API Key ID as the username and resource-specific
        API Key Secret as the password.
      scheme: basic
      type: http
