      - state
      type: object
    query.v1.QueryResult:
      description: |
        Query result containing schema metadata and row data.

        This envelope is the same for every statement kind. `SHOW` and `DESCRIBE` return declared column types in `schema` and string-encoded values in `data` exactly as `SELECT` does, so a client needs only one result reader and never has to branch on the statement it sent.
      properties:
        result_format:
          description: |
            Encoding of `data`, echoing the `options.result_format` requested on the statement.
          readOnly: true
          type: string
          x-extensible-enum:
          - JSON
          - ARROW_STREAM
        schema:
          allOf:
          - $ref: '#/components/schemas/query.v1.ResultSchema'
          description: Column metadata describing the shape of the returned rows.
        data:
          description: |
            Result rows in the encoding named by `result_format`: an array of rows for `JSON`, where each row is a positional array of column values ordered to match `schema.columns`; or a base64-encoded Arrow IPC stream for `ARROW_STREAM`, carrying native column types rather than stringified values. Inline Arrow payloads are size-capped by the service; larger results are delivered through the asynchronous 202 flow.

