    query.v1.JobStatus:
      description: The status of the background statement.
      properties:
        state:
          description: |
            The lifecycle state of the background statement. A job is always at least
            RUNNING by the time it can be polled — there is no earlier "queued" state.

            RUNNING: statement execution is in progress;

            SUCCEEDED: statement finished successfully; see `result_urls` for where to
            download the result;

            FAILED: statement execution failed; see `errors` for details.
          example: RUNNING
          readOnly: true
          type: string
          x-extensible-enum:
          - RUNNING
          - SUCCEEDED
          - FAILED
        result_urls:
          description: |
            Presigned URL(s) the result can be downloaded from. Always present (an empty array if there's nothing to download yet), not just when `state` is `SUCCEEDED` — reserved for a future partial-results feature that could populate this incrementally while `state` is still `RUNNING`; today it's only ever non-empty once `state` is `SUCCEEDED`. Empty for `FAILED`. Each URL expires after a limited time — re-poll this endpoint to obtain a fresh one if it lapses before download.
          items:
            format: uri
            type: string
          readOnly: true
          type: array
