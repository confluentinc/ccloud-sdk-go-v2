name: ccloud-sdk-go-v2
lang: go
lang_version: "1.26.8"
git:
  enable: true
github:
  enable: true
semaphore:
  enable: true
  pipeline_enable: false
  branches:
    - master
    - /^v\d+\.\d+\.\d+$/
  tasks:
    - name: Manual publish tag
      branch: git-tag
      pipeline_file: ".semaphore/git-tag.yml"
      parameters:
        - name: TAG
          required: true
          description: "Tag version to create (e.g., flink-gateway/v0.32.0)"
make:
  enable: true
  enable_updates: true
  update_makefile: false
